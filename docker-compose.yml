version: "2.4"

services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: txgate
      POSTGRES_USER: txgate
      POSTGRES_PASSWORD: txgate
    ports: ["127.0.0.1:5432:5432"]
    volumes: [appdb:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U txgate -d txgate"]
      interval: 2s
      timeout: 3s
      retries: 20
  db-sync:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: db_sync
      POSTGRES_USER: txgate
      POSTGRES_PASSWORD: txgate
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - dbsync:/var/lib/postgresql/data
      - ./migrations/db-sync/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U txgate -d db_sync"]
      interval: 2s
      timeout: 3s
      retries: 20
  evm:
    build:
      context: .
      target: dev
    command: ["npm", "run", "dev:evm"]
    ports: ["127.0.0.1:8545:8545"]
volumes:
  appdb:
  dbsync:
